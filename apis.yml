name: BioOrbit
description: >-
  BioOrbit is a London-based in-space manufacturing company, founded in 2023,
  that uses microgravity to crystallise protein-based biologic drugs at scale.
  Its autonomous BOX hardware — a compact, microwave-sized manufacturing unit
  designed to operate in low-Earth orbit — grows highly ordered crystalline
  forms of therapeutic proteins that reduce viscosity, enabling treatments
  normally given intravenously (including cancer therapies) to be reformulated
  as subcutaneous, self-injectable products. Co-founded by Dr Katie King and
  Dr Leonor Teles, BioOrbit raised the world's largest seed round for in-space
  manufacturing (~£9.8M / $13.2M) co-led by LocalGlobe and Breega with Seedcamp,
  Auxxo, Type One, 7percent and angels, and is supported by the UK Space Agency,
  ESA BIC and ESA BSGN. It was added to the API Evangelist network as a
  Seedcamp portfolio company; it publishes no public API or developer surface.
